services:
  - type: web
    name: ai-portfolio-assistant
    env: python
    healthCheckPath: "/api/health"
    rootDir: backend
    buildCommand: "python -m pip install --no-cache-dir --upgrade pip setuptools wheel && python -m pip install --no-cache-dir -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: SCHEDULER_INTERVAL_SECONDS
        value: 840
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_TELEMETRY
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SENTINAX_SUPABASE_JWT_MODE
        sync: false
      - key: SENTINAX_OWNER_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PROMETHEUS_MULTIPROC_DIR
        value: "/tmp/prometheus_multiproc_dir"
