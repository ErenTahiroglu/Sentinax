name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # frontend/ has no package manifest; the root package is authoritative.
    - name: Install dependencies
      run: npm ci

    - name: Run Unit and Integration Tests (Vitest)
      run: npm test

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # playwright.config.js starts the static frontend server via its webServer block.
    - name: Run E2E Tests (Playwright)
      run: npm run test:e2e

  backend-correctness:
    name: Backend Correctness Gate
    runs-on: ubuntu-latest

    # Disposable PostgreSQL for the Phase 26 real concurrent-writer test only (no production credentials).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinax_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinax_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r backend/requirements.txt

    # Scoped gate: only the verified correctness surfaces, not the whole backend suite.
    - name: Static invariant guards
      run: |
        python -m pytest \
          backend/tests/invariants/test_static_guards.py \
          -q --disable-socket

    - name: No-crypto invariant
      run: |
        python -m pytest \
          backend/tests/test_no_crypto_path.py \
          -q --disable-socket

    # Phase 27 FIX C: Shared source/identity authorities (instrument identity, private PIT storage, provider framework). The provider framework tests are asyncio tests: pytest-asyncio opens an AF_UNIX socketpair for its event loop, so AF_UNIX is allowed while every network socket stays blocked.
    - name: Phase 8-11 source and identity foundations
      run: |
        python -m pytest \
          backend/tests/test_instrument_identity.py \
          backend/tests/test_private_storage.py \
          backend/tests/test_provider_framework.py \
          -q --disable-socket --allow-unix-socket

    # Phase 27 FIX C: Mocked/fixture SEC contract tests only (no live SEC). AF_UNIX allowed for the asyncio event loop; network sockets stay blocked.
    - name: Phase 8 SEC fundamental-data correctness
      run: |
        python -m pytest \
          backend/tests/test_sec_concept_resolver.py \
          backend/tests/test_sec_edgar.py \
          backend/tests/test_sec_fiscal_series.py \
          backend/tests/test_sec_period_context.py \
          backend/tests/test_sec_quarter_derivation.py \
          backend/tests/test_sec_winner_resolver.py \
          -q --disable-socket --allow-unix-socket

    # Phase 27 FIX C: BIST source-adapter tests (distinct from the Phase 26 resolver regression below). AF_UNIX allowed for the asyncio event loop only.
    - name: Phase 9 BIST EOD ingestion correctness
      run: |
        python -m pytest \
          backend/tests/test_bist_eod.py \
          -q --disable-socket --allow-unix-socket

    # Phase 27 FIX C: Alpha Vantage, Marketstack and Tiingo adapters (distinct from the global EOD PIT resolver). AF_UNIX allowed for the asyncio event loop only.
    - name: Phase 10 global EOD provider correctness
      run: |
        python -m pytest \
          backend/tests/test_alpha_vantage_eod.py \
          backend/tests/test_marketstack_eod.py \
          backend/tests/test_tiingo_eod.py \
          -q --disable-socket --allow-unix-socket

    # Phase 27 FIX C: TEFAS price and current-metrics ingestion (distinct from Phase 16 fund analytics and the Phase 26 TEFAS resolvers). AF_UNIX allowed for the asyncio event loop only.
    - name: Phase 11 TEFAS source-ingestion correctness
      run: |
        python -m pytest \
          backend/tests/test_tefas_eod.py \
          backend/tests/test_tefas_metrics.py \
          -q --disable-socket --allow-unix-socket

    # Phase 27 FIX C: Core accounting/persistence authorities; full network-socket isolation.
    - name: Phase 12 portfolio domain and persistence correctness
      run: |
        python -m pytest \
          backend/tests/test_portfolio_accounting.py \
          backend/tests/test_portfolio_accounting_service.py \
          backend/tests/test_portfolio_cash.py \
          backend/tests/test_portfolio_domain.py \
          backend/tests/test_portfolio_ledger.py \
          backend/tests/test_portfolio_persistence.py \
          backend/tests/test_portfolio_persistence_schema.py \
          backend/tests/test_portfolio_positions.py \
          backend/tests/test_portfolio_postgrest_transport.py \
          backend/tests/test_portfolio_projection.py \
          backend/tests/test_portfolio_repository.py \
          -q --disable-socket

    # Phase 27 FIX C: Import pipeline including the canonical CSV path; full network-socket isolation.
    - name: Phase 13 portfolio import pipeline correctness
      run: |
        python -m pytest \
          backend/tests/test_portfolio_import_assessment.py \
          backend/tests/test_portfolio_import_atomic_batch_commit_repository.py \
          backend/tests/test_portfolio_import_atomic_batch_commit_schema.py \
          backend/tests/test_portfolio_import_atomic_commit_repository.py \
          backend/tests/test_portfolio_import_atomic_commit_schema.py \
          backend/tests/test_portfolio_import_batch.py \
          backend/tests/test_portfolio_import_claim_schema.py \
          backend/tests/test_portfolio_import_commit.py \
          backend/tests/test_portfolio_import_commit_persistence.py \
          backend/tests/test_portfolio_import_draft.py \
          backend/tests/test_portfolio_import_draft_batch.py \
          backend/tests/test_portfolio_import_instrument_resolution.py \
          backend/tests/test_portfolio_import_instrument_resolver.py \
          backend/tests/test_portfolio_import_materialization.py \
          backend/tests/test_portfolio_import_parsed_batch.py \
          backend/tests/test_portfolio_import_parsing.py \
          backend/tests/test_portfolio_import_pipeline.py \
          backend/tests/test_portfolio_import_provenance.py \
          backend/tests/test_portfolio_import_write_surface_schema.py \
          backend/tests/test_sentinax_canonical_csv_import.py \
          backend/tests/test_sentinax_canonical_csv_import_execution.py \
          backend/tests/test_sentinax_canonical_csv_parser.py \
          backend/tests/test_sentinax_canonical_csv_semantics.py \
          -q --disable-socket

    # Phase 27 FIX C: In addition to (never instead of) the real PostgreSQL Phase 27 privilege/concurrency gate below; full network-socket isolation.
    - name: Phase 14 fee-tax attribution correctness
      run: |
        python -m pytest \
          backend/tests/test_portfolio_fee_tax.py \
          backend/tests/test_portfolio_fee_tax_attribution.py \
          backend/tests/test_portfolio_fee_tax_attribution_active_ledger_schema.py \
          backend/tests/test_portfolio_fee_tax_attribution_binding.py \
          backend/tests/test_portfolio_fee_tax_attribution_command.py \
          backend/tests/test_portfolio_fee_tax_attribution_cross_stream_pit_schema.py \
          backend/tests/test_portfolio_fee_tax_attribution_history.py \
          backend/tests/test_portfolio_fee_tax_attribution_history_schema.py \
          backend/tests/test_portfolio_fee_tax_attribution_persistence.py \
          backend/tests/test_portfolio_fee_tax_attribution_repository.py \
          backend/tests/test_portfolio_fee_tax_attribution_schema.py \
          backend/tests/test_portfolio_fee_tax_attribution_service.py \
          backend/tests/test_portfolio_fee_tax_attribution_transport.py \
          backend/tests/test_portfolio_fee_tax_attribution_write_repository.py \
          backend/tests/test_portfolio_fee_tax_phase14_end_to_end.py \
          backend/tests/test_portfolio_fee_tax_service.py \
          -q --disable-socket

    # Phase 27 FIX D: SQL-text and Edge Function source-contract tests (the real PostgreSQL privilege/RLS/atomicity regression is the separate PostgreSQL step below).
    - name: Phase 27 Supabase security schema and Edge Function contract
      run: |
        python -m pytest \
          backend/tests/test_supabase_security_advisor_schema.py \
          -q --disable-socket

    - name: Phase 15A temporal and risk context correctness
      run: |
        python -m pytest \
          backend/tests/test_goal_date.py \
          backend/tests/test_analysis_horizon.py \
          backend/tests/test_analysis_pit.py \
          backend/tests/test_analysis_context.py \
          backend/tests/test_risk_context.py \
          -q --disable-socket

    - name: Phase 15B risk-evidence regression chain
      run: |
        python -m pytest \
          backend/tests/test_risk_evidence.py \
          backend/tests/test_risk_evidence_provenance.py \
          backend/tests/test_risk_evidence_availability.py \
          backend/tests/test_risk_evidence_pit_binding.py \
          backend/tests/test_risk_evidence_resolution.py \
          backend/tests/test_risk_evidence_content_match.py \
          -q --disable-socket

    - name: Phase 15C risk evidence correctness
      run: |
        python -m pytest \
          backend/tests/test_private_domain.py \
          backend/tests/test_risk_evidence_kind_binding.py \
          backend/tests/test_risk_evidence_cash_schema.py \
          backend/tests/test_risk_evidence_cash_resolution.py \
          backend/tests/test_risk_evidence_planned_contribution_schema.py \
          backend/tests/test_risk_evidence_planned_contribution_resolution.py \
          backend/tests/test_risk_evidence_investment_goal_schema.py \
          backend/tests/test_risk_evidence_investment_goal_resolution.py \
          -q --disable-socket

    - name: Phase 16 TEFAS fund engine correctness
      run: |
        python -m pytest \
          backend/tests/test_tefas_fund_price_series.py \
          backend/tests/test_tefas_fund_return_series.py \
          backend/tests/test_tefas_fund_drawdown.py \
          backend/tests/test_tefas_fund_rolling_returns.py \
          backend/tests/test_tefas_fund_downside_deviation.py \
          backend/tests/test_tefas_fund_annualized_returns.py \
          backend/tests/test_tefas_fund_category.py \
          backend/tests/test_tefas_fund_peer_percentile.py \
          backend/tests/test_tefas_fund_peer_persistence.py \
          backend/tests/test_tefas_fund_expected_shortfall.py \
          backend/tests/test_tefas_fund_volatility.py \
          -q --disable-socket

    - name: Phase 17 macro PIT and evidence correctness
      run: |
        python -m pytest \
          backend/tests/test_macro_state_inputs.py \
          backend/tests/test_macro_state_query.py \
          backend/tests/test_macro_state_history.py \
          backend/tests/test_us_treasury_curve.py \
          backend/tests/test_us_macro_evidence.py \
          -q --disable-socket

    - name: Phase 17 macro provider contracts
      run: |
        python -m pytest \
          backend/tests/test_macro_providers.py \
          backend/tests/test_fred_alfred.py \
          backend/tests/test_precious_metals.py \
          -q

    - name: Phase 18 allocation benchmark correctness
      run: |
        python -m pytest \
          backend/tests/test_allocation_matrix.py \
          backend/tests/test_allocation_benchmarks.py \
          backend/tests/test_allocation_risk_parity.py \
          backend/tests/test_allocation_hrp.py \
          -q --disable-socket

    - name: Phase 19 CVaR authority and optimizer correctness
      run: |
        python -m pytest \
          backend/tests/test_allocation_cvar.py \
          backend/tests/test_allocation_cvar_optimizer.py \
          -q --disable-socket

    - name: Phase 20 user view overlay correctness
      run: |
        python -m pytest \
          backend/tests/test_allocation_user_views.py \
          backend/tests/test_allocation_user_view_posterior.py \
          -q --disable-socket

    - name: Phase 21 rebalance policy correctness
      run: |
        python -m pytest \
          backend/tests/test_allocation_rebalance.py \
          backend/tests/test_allocation_rebalance_policy.py \
          -q --disable-socket

    - name: Phase 22 candidate universe correctness
      run: |
        python -m pytest \
          backend/tests/test_allocation_universe_composition.py \
          backend/tests/test_allocation_candidate_universe.py \
          -q --disable-socket

    - name: Phase 23 Game Changer correctness
      run: |
        python -m pytest \
          backend/tests/test_game_changer_event.py \
          backend/tests/test_game_changer_assessment.py \
          backend/tests/test_game_changer_revision_family.py \
          backend/tests/test_game_changer_gate.py \
          backend/tests/test_game_changer_extraction.py \
          -q --disable-socket

    - name: Phase 24 private scheduler correctness
      run: |
        python -m pytest \
          backend/tests/test_scheduler_trigger.py \
          backend/tests/test_scheduler_scheduled_occurrence.py \
          backend/tests/test_scheduler_recurrence.py \
          backend/tests/test_scheduler_calendar_evidence.py \
          backend/tests/test_scheduler_calendar_applicability.py \
          backend/tests/test_scheduler_event_occurrence.py \
          backend/tests/test_scheduler_run_admission.py \
          backend/tests/test_scheduler_run_lifecycle.py \
          backend/tests/test_scheduler_run_persistence_schema.py \
          backend/tests/test_scheduler_run_persistence_codec.py \
          backend/tests/test_scheduler_run_persistence_transport.py \
          backend/tests/test_scheduler_run_repository.py \
          backend/tests/test_scheduler_runtime.py \
          backend/tests/test_scheduler_work_dispatcher.py \
          backend/tests/test_scheduler_phase24_boundary.py \
          -q --disable-socket

    - name: Phase 26 backtest architecture correctness
      run: |
        python -m pytest \
          backend/tests/test_backtest_replay_point.py \
          backend/tests/test_backtest_market_data_bridge.py \
          backend/tests/test_backtest_replay_plan.py \
          backend/tests/test_backtest_analysis_context.py \
          backend/tests/test_backtest_input_bindings.py \
          backend/tests/test_backtest_portfolio_projection.py \
          backend/tests/test_backtest_portfolio_history_coverage.py \
          backend/tests/test_backtest_market_data_resolution_snapshot.py \
          backend/tests/test_backtest_user_view_history.py \
          backend/tests/test_backtest_user_view_resolution.py \
          backend/tests/test_backtest_input_completeness.py \
          backend/tests/test_backtest_game_changer_replay.py \
          backend/tests/test_backtest_candidate_eligibility_replay.py \
          backend/tests/test_backtest_market_data_selected_observation.py \
          backend/tests/test_backtest_market_data_temporal_admission.py \
          backend/tests/test_backtest_marked_holdings.py \
          backend/tests/test_backtest_investable_cash.py \
          backend/tests/test_backtest_rebalance_current_state.py \
          backend/tests/test_backtest_cross_universe_composition.py \
          backend/tests/test_backtest_rebalance_plan.py \
          backend/tests/test_backtest_game_changer_plan_admission.py \
          backend/tests/test_backtest_decision_replay_sequence.py \
          backend/tests/test_portfolio_transaction_write_surface_hardening_schema.py \
          backend/tests/test_portfolio_trigger_privilege_hardening_schema.py \
          backend/tests/test_portfolio_transaction_history_coverage_schema.py \
          -q --disable-socket

    - name: Phase 26 market-data dependency regression
      run: |
        python -m pytest \
          backend/tests/test_market_data_resolver.py \
          backend/tests/test_global_eod_resolver.py \
          backend/tests/test_tefas_price_resolver.py \
          backend/tests/test_tefas_metrics_resolver.py \
          -q --disable-socket

    # test_precious_metals.py is not socket-disabled-compatible (its TCMB EVDS provider tests need the socket plugin untouched); same invocation as the Phase 17 provider step.
    - name: Phase 26 precious-metal resolver dependency regression
      run: |
        python -m pytest \
          backend/tests/test_precious_metals.py \
          -q

    # Real PostgreSQL (no --disable-socket). The test-only driver is installed here, never in backend/requirements.txt.
    - name: Phase 26 PostgreSQL history-coverage concurrency
      env:
        SENTINAX_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/sentinax_concurrency
      run: |
        python -m pip install "psycopg[binary]==3.3.6"
        python -m pytest \
          backend/tests/test_portfolio_transaction_history_coverage_postgres.py \
          -v -s

    # Real PostgreSQL: executes the REAL migrations 011, 018-021, 025 and 027 (no copied trigger logic). Each test file resets the disposable database itself.
    - name: Phase 27 PostgreSQL ledger trigger privilege regression
      env:
        SENTINAX_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/sentinax_concurrency
      run: |
        python -m pytest \
          backend/tests/test_portfolio_trigger_privilege_postgres.py \
          -v -s

    # Real PostgreSQL: executes the REAL migrations 001 through 028 (rate_limits RLS, consume_rate_limit ACL/atomicity, Vault retrieval, SECURITY DEFINER and search_path inventories).
    - name: Phase 27 PostgreSQL Supabase security advisor regression
      env:
        SENTINAX_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/sentinax_concurrency
      run: |
        python -m pytest \
          backend/tests/test_supabase_security_advisor_postgres.py \
          -v -s
